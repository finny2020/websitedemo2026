<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wet Ink Studio</title>
<meta name="description" content="Wet Ink Studio: identity, print, packaging and websites.">
<meta name="theme-color" content="#050505">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="bar" id="bar" data-tone="dark">
  <div class="bar__glass">
    <a class="logo" href="#top" aria-label="Wet Ink Studio, back to top">
      <svg class="blot--sm" viewBox="0 0 60 72" aria-hidden="true"><path d="M30 2C30 2 6 30 6 46a24 24 0 0 0 48 0C54 30 30 2 30 2Z" fill="url(#chrome)"/></svg>
      <span class="logo__word">Wet Ink</span>
    </a>
    <nav class="nav" id="nav" aria-label="Main">
      <span class="nav__pill" id="navPill" aria-hidden="true"></span>
      <a href="#studio">Studio</a>
      <a href="#archive">Archive</a>
      <a href="#services">Services</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<main id="top">

  <!-- HERO: an iridescent form over a turning guilloche, with chrome sparkles -->
  <section class="hero" id="stage" aria-label="Wet Ink Studio">
    <svg class="rosette" id="rosette" viewBox="-500 -500 1000 1000" aria-hidden="true"></svg>

    <div class="hero__bottom">
      <!-- "ink" is set with a dotless ı: Blot sits where the dot would be -->
      <h1 class="mega" aria-label="Wet Ink Studio">
        <span class="mega__line"><span class="mega__rise chrome">Wet</span></span>
        <span class="mega__line"><span class="mega__rise mega__rise--2"><span class="tittle-host chrome">ı<button class="mascot" id="mascot" type="button" aria-label="Blot, the studio mascot. Drag it around or tap it.">
          <svg class="blot" viewBox="0 0 60 72" aria-hidden="true">
            <path d="M30 2C30 2 6 30 6 46a24 24 0 0 0 48 0C54 30 30 2 30 2Z" fill="url(#chrome)"/>
            <ellipse cx="19" cy="34" rx="3.4" ry="7" fill="#fff" opacity=".8" transform="rotate(20 19 34)"/>
            <g class="eyes">
              <ellipse cx="21" cy="46" rx="6" ry="7.2" fill="#050505"/>
              <ellipse cx="39" cy="46" rx="6" ry="7.2" fill="#050505"/>
              <circle class="pupil" cx="21" cy="47" r="2.6" fill="#fff"/>
              <circle class="pupil" cx="39" cy="47" r="2.6" fill="#fff"/>
            </g>
          </svg>
        </button></span><span class="chrome">nk</span></span></span>
      </h1>
      <p class="hero__line in in--3"><em>Marks that stay.</em></p>
    </div>
  </section>

  <!-- STUDIO: one sentence on laid paper -->
  <!-- STUDIO: icy 3D type floating on a white liquid surface (both rendered in js/scene3d.js) -->
  <section class="studio" id="studio" aria-label="Studio">
    <p class="studio__line"><span class="studio__l1">Drawn by hand,</span> <span class="studio__l2"><em>finished like jewellery.</em></span></p>
  </section>

  <!-- ARCHIVE: one short row. Socks, then concept studies rendered in 3D (drag to spin). -->
  <section class="archive" id="archive" aria-labelledby="archiveTitle">
    <h2 class="archive__title reveal" id="archiveTitle"><em>Archive</em></h2>
    <ul class="strip" aria-label="Archive">
      <li><button class="piece piece--img reveal" type="button" data-open="0" aria-label="Quiet Luxury / Loud Feet. Open."><img src="assets/archive/loud-feet-sock.webp" alt="" draggable="false"><span class="piece__name">Loud Feet</span></button></li>
      <li><div class="piece reveal" data-obj="pearl" role="img" aria-label="Pearl study, a 3D concept piece. Drag to turn it."><span class="piece__name">Pearl</span></div></li>
      <li><div class="piece reveal" data-obj="orbit" role="img" aria-label="Glass orbit study, a 3D concept piece. Drag to turn it."><span class="piece__name">Orbit</span></div></li>
      <li><div class="piece reveal" data-obj="fuzz" role="img" aria-label="Fuzz study, a 3D concept piece. Drag to turn it."><span class="piece__name">Fuzz</span></div></li>
      <li><div class="piece reveal" data-obj="coral" role="img" aria-label="Coral study, a 3D concept piece. Drag to turn it."><span class="piece__name">Coral</span></div></li>
      <li><div class="piece reveal" data-obj="melt" role="img" aria-label="Melt study, a 3D concept piece. Drag to turn it."><span class="piece__name">Melt</span></div></li>
    </ul>
  </section>

  <!-- SERVICES: four words on fluorescent green -->
  <section class="services" id="services" aria-label="Services">
    <ul class="rows">
      <li class="row reveal"><h3 class="row__t">Identity</h3></li>
      <li class="row reveal"><h3 class="row__t"><em>Packaging</em></h3></li>
      <li class="row reveal"><h3 class="row__t">Print</h3></li>
      <li class="row reveal"><h3 class="row__t"><em>Websites</em></h3></li>
    </ul>
  </section>

  <!-- CONTACT: fluorescent pink -->
  <section class="contact" id="contact" aria-labelledby="contactTitle">
    <h2 class="contact__title reveal" id="contactTitle">Write <em>to us.</em></h2>
    <div class="contact__actions reveal">
      <button class="contact__mail" id="mail" type="button" aria-live="polite">hello@wetink.studio</button>
      <a class="contact__ig" href="https://www.instagram.com/wetink.studio/" target="_blank" rel="noopener">Instagram ↗</a>
    </div>
  </section>
</main>

<footer class="foot" id="foot">
  <svg class="gband gband--light" data-gband aria-hidden="true"></svg>
  <p class="foot__word chrome-letters" id="footWord" aria-label="Wet Ink">
    <span>W</span><span>E</span><span>T</span><span class="sp"> </span><span>I</span><span>N</span><span>K</span>
  </p>
</footer>

<!-- Detail sheet: grows out of the piece you opened, drag it down to put it back -->
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet__handle" id="sheetHandle">
    <span class="sheet__grabber" aria-hidden="true"></span>
    <div class="sheet__head">
      <h2 class="sheet__title" id="sheetTitle"></h2>
      <button class="round" id="sheetClose" type="button" aria-label="Close">✕</button>
    </div>
  </div>
  <div class="sheet__body" id="sheetBody"></div>
</section>

<!-- Shared defs: the chrome gradient and the four-point star -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".22" stop-color="#9fe9ff"/><stop offset=".42" stop-color="#ffffff"/>
      <stop offset=".58" stop-color="#ff9de6"/><stop offset=".78" stop-color="#e9ffc4"/><stop offset="1" stop-color="#8a8a96"/>
    </linearGradient>
    <radialGradient id="starFill" cx=".42" cy=".38" r=".75">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".25" stop-color="#e9ffc4"/><stop offset=".45" stop-color="#9fe9ff"/>
      <stop offset=".65" stop-color="#7a6bff"/><stop offset=".85" stop-color="#ff3ec8"/><stop offset="1" stop-color="#ffd1f3"/>
    </radialGradient>
  </defs>
  <symbol id="starShape" viewBox="-100 -100 200 200">
    <path d="M0-96C8-40 22-22 96 0C22 22 8 40 0 96C-8 40-22 22-96 0C-22-22-8-40 0-96Z" fill="url(#starFill)"/>
    <path d="M0-96C8-40 22-22 96 0C22 22 8 40 0 96C-8 40-22 22-96 0C-22-22-8-40 0-96Z" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.2"/>
    <ellipse cx="-14" cy="-22" rx="9" ry="22" fill="#fff" opacity=".85" transform="rotate(-25 -14 -22)"/>
  </symbol>
</svg>

<script src="js/main.js"></script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<script type="module" src="js/scene3d.js"></script>
</body>
</html>
